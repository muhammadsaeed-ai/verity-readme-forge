<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">ReadmeForge by VerityAgent</title><desc id="desc">Premium dark navy and cyan visual for a local README generator with a mock terminal and structured documentation preview.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050A16"/><stop offset=".6" stop-color="#0A1930"/><stop offset="1" stop-color="#17102D"/></linearGradient><linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#39E5F8"/><stop offset="1" stop-color="#5E85FF"/></linearGradient><pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#244366" opacity=".3"/></pattern><filter id="glow"><feGaussianBlur stdDeviation="20"/></filter></defs><rect width="1200" height="420" rx="24" fill="url(#bg)" stroke="#294565"/><rect width="1200" height="420" rx="24" fill="url(#grid)"/><circle cx="1000" cy="55" r="160" fill="#2F67FF" opacity=".15" filter="url(#glow)"/><g transform="translate(48 48)"><rect width="52" height="52" rx="14" fill="#0A2944" stroke="url(#cyan)" stroke-width="2"/><path d="M15 14h23M15 23h23M15 32h15" stroke="#66E7FF" stroke-width="3" stroke-linecap="round"/><text x="67" y="30" fill="#F1F7FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="37" font-weight="760">Readme<tspan fill="url(#cyan)">Forge</tspan></text><text x="68" y="52" fill="#82A9CF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10.5" font-weight="750" letter-spacing="2.5">VERITYAGENT · DEVELOPER TOOLING</text><text x="2" y="119" fill="#F3F7FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="750">Turn repository evidence</text><text x="2" y="155" fill="#4ADDF5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="750">into documentation that earns trust.</text><text x="3" y="190" fill="#A3BAD3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Inspect manifests. Map structure. Generate a README draft.</text><text x="3" y="212" fill="#A3BAD3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Local-first, bounded, and explicit about what it cannot know.</text><g transform="translate(2 242)"><rect width="148" height="31" rx="15" fill="#0D2A43" stroke="#286F95"/><circle cx="17" cy="15" r="4" fill="#47E3F4"/><text x="29" y="20" fill="#D7F6FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10.5" font-weight="750">LOCAL-FIRST</text><rect x="158" width="157" height="31" rx="15" fill="#0C2B2B" stroke="#287E76"/><circle cx="175" cy="15" r="4" fill="#55E5BC"/><text x="187" y="20" fill="#D7FFF3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10.5" font-weight="750">ZERO RUNTIME DEPS</text><rect x="325" width="155" height="31" rx="15" fill="#1A1D3D" stroke="#605DA3"/><circle cx="342" cy="15" r="4" fill="#A88AFF"/><text x="354" y="20" fill="#E8DFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10.5" font-weight="750">EVIDENCE-BASED</text></g></g><g transform="translate(650 50)"><rect width="502" height="323" rx="18" fill="#07111F" stroke="#2B4D6C"/><path d="M0 18Q0 0 18 0H484Q502 0 502 18V44H0Z" fill="#112741"/><circle cx="21" cy="22" r="4" fill="#FF7F95"/><circle cx="37" cy="22" r="4" fill="#FFD06D"/><circle cx="53" cy="22" r="4" fill="#5BE3B7"/><text x="71" y="26" fill="#C9DFF0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">readmeforge · generate ./README.md</text><g font-family="ui-monospace,Consolas,monospace" font-size="11"><text x="24" y="77" fill="#61E5FA">$ readmeforge inspect .</text><text x="24" y="101" fill="#64E4BC">✓ Repository inventory complete</text><text x="24" y="124" fill="#64E4BC">✓ Project manifests recognized</text><text x="24" y="147" fill="#64E4BC">✓ Test and CI paths detected</text><text x="24" y="170" fill="#8CB1D1">→ Building evidence report…</text></g><rect x="23" y="186" width="456" height="1" fill="#1F3A54"/><text x="24" y="210" fill="#7FA9CB" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="750" letter-spacing="1.5">GENERATED README STRUCTURE</text><g transform="translate(24 225)"><rect width="213" height="34" rx="8" fill="#0C2A42" stroke="#27779A"/><text x="12" y="21" fill="#D9F8FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700">01 · Install guide</text><rect x="225" width="230" height="34" rx="8" fill="#171D3A" stroke="#5A5A9C"/><text x="237" y="21" fill="#E6E0FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700">02 · Architecture map</text><rect y="44" width="213" height="34" rx="8" fill="#0C2A42" stroke="#27779A"/><text x="12" y="65" fill="#D9F8FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700">03 · Scripts &amp; examples</text><rect x="225" y="44" width="230" height="34" rx="8" fill="#0C2B2B" stroke="#287E76"/><text x="237" y="65" fill="#D7FFF3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700">04 · Contribution checklist</text></g><rect x="24" y="307" width="454" height="1" fill="#1F3A54"/><text x="24" y="311" fill="#79A5C9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9.5">STATIC INSPECTION · REVIEW BEFORE PUBLISHING</text></g><text x="50" y="398" fill="#607FA2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10.5" letter-spacing="1">README GENERATOR · REPOSITORY ANALYSIS · MARKDOWN · MERMAID · DEVELOPER PRODUCTIVITY</text><text x="1150" y="398" text-anchor="end" fill="#59DEF4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10.5" font-weight="750">VERITYAGENT</text></svg>