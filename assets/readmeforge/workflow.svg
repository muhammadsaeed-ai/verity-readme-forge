<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="255" viewBox="0 0 1200 255" role="img" aria-labelledby="title desc"><title id="title">ReadmeForge workflow</title><desc id="desc">Inventory local files, read selected manifests, normalize evidence, and render a README draft without executing project code.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06101D"/><stop offset="1" stop-color="#11172D"/></linearGradient></defs><rect width="1200" height="255" rx="20" fill="url(#bg)" stroke="#214363"/><text x="28" y="35" fill="#F0F7FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="750">FROM REPOSITORY TO README</text><text x="1172" y="35" text-anchor="end" fill="#82A7CE" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">local analysis · reviewable output</text><g transform="translate(28 61)"><rect width="250" height="139" rx="14" fill="#0B2035" stroke="#2A6A97"/><circle cx="25" cy="26" r="13" fill="#3DDDF6"/><text x="25" y="30" text-anchor="middle" fill="#061422" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="800">01</text><text x="47" y="30" fill="#F0F7FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">Inventory</text><text x="16" y="58" fill="#9BB9D5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5">Paths, types, folders</text><text x="16" y="82" fill="#56DEFA" font-family="ui-monospace,Consolas,monospace" font-size="11">ignore-aware scan</text><text x="16" y="105" fill="#7E9FBD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10.5">bounded reads · no symlinks</text></g><path d="M284 130h23m-7-6 7 6-7 6" stroke="#42DDF6" stroke-width="2" fill="none"/><g transform="translate(310 61)"><rect width="250" height="139" rx="14" fill="#0B2035" stroke="#2A6A97"/><circle cx="25" cy="26" r="13" fill="#4AABFF"/><text x="25" y="30" text-anchor="middle" fill="#061422" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="800">02</text><text x="47" y="30" fill="#F0F7FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">Read manifests</text><text x="16" y="58" fill="#9BB9D5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5">Project metadata + scripts</text><text x="16" y="82" fill="#56DEFA" font-family="ui-monospace,Consolas,monospace" font-size="11">pyproject · package.json</text><text x="16" y="105" fill="#7E9FBD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10.5">never install target packages</text></g><path d="M566 130h23m-7-6 7 6-7 6" stroke="#42DDF6" stroke-width="2" fill="none"/><g transform="translate(592 61)"><rect width="250" height="139" rx="14" fill="#191B3A" stroke="#6B61A9"/><circle cx="25" cy="26" r="13" fill="#A88AFF"/><text x="25" y="30" text-anchor="middle" fill="#170F2A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="800">03</text><text x="47" y="30" fill="#F3EEFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">Build evidence</text><text x="16" y="58" fill="#B4ADDA" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5">Languages, tests, CI, docs</text><text x="16" y="82" fill="#C1B4FF" font-family="ui-monospace,Consolas,monospace" font-size="11">normalized report.json</text><text x="16" y="105" fill="#938BC3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10.5">facts separated from guesses</text></g><path d="M848 130h23m-7-6 7 6-7 6" stroke="#A88AFF" stroke-width="2" fill="none"/><g transform="translate(874 61)"><rect width="298" height="139" rx="14" fill="#0A282C" stroke="#2B7B78"/><circle cx="25" cy="26" r="13" fill="#54E2BC"/><text x="25" y="30" text-anchor="middle" fill="#05261F" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="800">04</text><text x="47" y="30" fill="#EDFFFA" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">Render + review</text><text x="16" y="58" fill="#9FCFC5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5">README · Mermaid · examples</text><text x="16" y="82" fill="#63E5D0" font-family="ui-monospace,Consolas,monospace" font-size="11">README.generated.md</text><text x="16" y="105" fill="#85BFB7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10.5">no overwrite without --force</text></g><text x="28" y="233" fill="#7898B9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">ReadmeForge does not execute source files or prove that inferred project commands work.</text></svg>