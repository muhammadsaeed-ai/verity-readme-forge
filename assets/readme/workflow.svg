<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="240" viewBox="0 0 1100 240" role="img" aria-labelledby="t d"><title id="t">ReadmeForge workflow</title><desc id="d">Inspect local files, extract known project facts, assemble a Markdown draft, then review before publishing.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102238"/><stop offset="1" stop-color="#182e4a"/></linearGradient></defs><rect width="1100" height="240" rx="20" fill="#071321"/><g font-family="Arial,sans-serif"><g transform="translate(28 42)"><rect width="218" height="150" rx="13" fill="url(#g)" stroke="#396589"/><circle cx="34" cy="34" r="15" fill="#59d6c7"/><text x="34" y="39" font-size="15" text-anchor="middle" fill="#08222a" font-weight="bold">1</text><text x="58" y="39" font-size="17" fill="#e4efff" font-weight="bold">Inspect</text><text x="22" y="77" fill="#a9bed5" font-size="14">Manifests, source, tests,</text><text x="22" y="99" fill="#a9bed5" font-size="14">workflows and license.</text></g><path d="M254 117h46m-12-8 12 8-12 8" stroke="#59d6c7" stroke-width="3" fill="none"/><g transform="translate(309 42)"><rect width="218" height="150" rx="13" fill="url(#g)" stroke="#396589"/><circle cx="34" cy="34" r="15" fill="#59d6c7"/><text x="34" y="39" font-size="15" text-anchor="middle" fill="#08222a" font-weight="bold">2</text><text x="58" y="39" font-size="17" fill="#e4efff" font-weight="bold">Extract</text><text x="22" y="77" fill="#a9bed5" font-size="14">Separate observed facts</text><text x="22" y="99" fill="#a9bed5" font-size="14">from inferred commands.</text></g><path d="M535 117h46m-12-8 12 8-12 8" stroke="#59d6c7" stroke-width="3" fill="none"/><g transform="translate(590 42)"><rect width="218" height="150" rx="13" fill="url(#g)" stroke="#396589"/><circle cx="34" cy="34" r="15" fill="#59d6c7"/><text x="34" y="39" font-size="15" text-anchor="middle" fill="#08222a" font-weight="bold">3</text><text x="58" y="39" font-size="17" fill="#e4efff" font-weight="bold">Draft</text><text x="22" y="77" fill="#a9bed5" font-size="14">Build sections and a</text><text x="22" y="99" fill="#a9bed5" font-size="14">generic architecture map.</text></g><path d="M816 117h46m-12-8 12 8-12 8" stroke="#59d6c7" stroke-width="3" fill="none"/><g transform="translate(871 42)"><rect width="201" height="150" rx="13" fill="url(#g)" stroke="#59d6c7"/><circle cx="34" cy="34" r="15" fill="#59d6c7"/><text x="34" y="39" font-size="15" text-anchor="middle" fill="#08222a" font-weight="bold">4</text><text x="58" y="39" font-size="17" fill="#e4efff" font-weight="bold">Review</text><text x="22" y="77" fill="#a9bed5" font-size="14">Run commands, correct</text><text x="22" y="99" fill="#a9bed5" font-size="14">claims, then publish.</text></g></g></svg>
