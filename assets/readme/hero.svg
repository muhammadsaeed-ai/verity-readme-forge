<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
<title id="title">ReadmeForge: documentation grounded in your repository</title><desc id="desc">A dark gradient banner illustrating source files flowing through a repository scanner into an evidence-backed README.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07131f"/><stop offset="1" stop-color="#132b48"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#62e6d1"/><stop offset="1" stop-color="#5696ff"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1200" height="340" rx="26" fill="url(#bg)"/><circle cx="1030" cy="60" r="190" fill="#2459a8" opacity=".13"/><circle cx="930" cy="330" r="150" fill="#47dec4" opacity=".09"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif" fill="#f2f7ff"><text x="62" y="76" font-size="16" letter-spacing="4" fill="#77dfd3">VERITYAGENT · DEVELOPER TOOLS</text><text x="62" y="145" font-size="56" font-weight="750">ReadmeForge</text><text x="64" y="190" font-size="23" fill="#c0d1e6">From repository evidence to a readable first draft.</text><text x="64" y="226" font-size="18" fill="#93aac6">Offline · Deterministic · Review-before-publish</text></g>
<g transform="translate(700 72)"><rect x="0" y="0" width="126" height="150" rx="12" fill="#0d1f32" stroke="#3d668c"/><path d="M28 26h60M28 42h44M28 58h54M28 74h34" stroke="#6aa1c8" stroke-width="7" stroke-linecap="round"/><text x="63" y="124" text-anchor="middle" font-size="15" fill="#dbeafe" font-family="Arial">SOURCE</text><path d="M138 76h68" stroke="url(#accent)" stroke-width="3"/><path d="m196 66 12 10-12 10" fill="none" stroke="#62e6d1" stroke-width="3"/><rect x="222" y="-10" width="126" height="170" rx="14" fill="#0d1f32" stroke="#54d7c6"/><circle cx="285" cy="29" r="13" fill="none" stroke="#62e6d1" stroke-width="3"/><path d="m279 29 5 5 9-11" fill="none" stroke="#62e6d1" stroke-width="3" stroke-linecap="round"/><path d="M246 56h76M246 73h68M246 90h75M246 107h55" stroke="#7ea7d2" stroke-width="6" stroke-linecap="round"/><text x="285" y="139" text-anchor="middle" font-size="15" fill="#dbeafe" font-family="Arial">README DRAFT</text></g>
<rect x="62" y="270" width="1076" height="1" fill="#5b7491" opacity=".45"/><text x="62" y="305" font-size="15" fill="#8da5bf" font-family="Arial">A scanner, not a guesser: commands and project facts are marked as inferred and must be reviewed.</text>
</svg>
